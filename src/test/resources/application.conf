pekko {
  loglevel: "WARNING"
  loglevel: ${?ENV_LOG_LEVEL}
  log-dead-letters = 0,
  warn-about-java-serializer-usage = true
  jvm-exit-on-fatal-error = true
  persistence {
    journal.plugin = org.apache.pekko.persistence.journal.inmem
    read-journal.plugin = org.apache.pekko.persistence.journal.inmem
    no-snapshot-store.class = org.apache.pekko.persistence.snapshot.NoSnapshotStore
    snapshot-store.plugin = org.apache.pekko.persistence.snapshot-store.local
  }
}
